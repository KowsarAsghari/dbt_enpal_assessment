version: 2

models:
  - name: stg_pipedrive__deal_changes
    description: |
      Staging model for deal stage change events.
      Filters for stage transitions and adds date fields.
      Grain: One row per stage change per deal
      Rows: 8,906
    config:
      tags: ['staging', 'daily']
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - deal_id
            - stage_change_timestamp
            - stage_id
    columns:
      - name: change_id
        description: "Surrogate key"
        data_tests:
          - unique
          - not_null
      - name: deal_id
        description: "Deal identifier"
        data_tests:
          - not_null
      - name: stage_id
        description: "Pipeline stage (1-9, expandable)"
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_pipedrive__stages')
              field: stage_id
      - name: stage_change_timestamp
        data_tests:
          - not_null
      - name: stage_change_date
        data_tests:
          - not_null
      - name: stage_change_month
        data_tests:
          - not_null
      - name: stage_change_week
        data_tests:
          - not_null
      - name: stage_change_quarter
        data_tests:
          - not_null
      - name: stage_change_year
        data_tests:
          - not_null

  - name: stg_pipedrive__stages
    description: |
      Staging model for pipeline stage definitions.
      Adds stage_category and stage_order.
      Grain: One row per stage
      Rows: 9
    config:
      tags: ['staging', 'dimension', 'static']
    columns:
      - name: stage_id
        description: "Unique stage identifier"
        data_tests:
          - unique
          - not_null
      - name: stage_name
        data_tests:
          - not_null
          - unique
      - name: stage_order
        data_tests:
          - not_null
      - name: stage_category
        data_tests:
          - not_null
          - accepted_values:
              values: ['Early Stage', 'Mid Stage', 'Late Stage']

  - name: stg_pipedrive__activity
    description: |
      Staging model for sales activities.
      Fixes VARCHAR FK to INTEGER FK for performance.
      Deduplicates perfect duplicates from source.
      Grain: One row per activity
      Rows: 4,579
    config:
      tags: ['staging', 'daily']
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - activity_id
            - deal_id
    columns:
      - name: activity_id
        description: "Activity identifier (NOT unique - same ID for multiple deals)"
        data_tests:
          - not_null
      - name: deal_id
        description: "Related deal"
      - name: user_id
        description: "Assigned user"
        data_tests:
          - not_null
      - name: activity_type_id
        description: "Activity type (INTEGER FK - performance optimized)"
        data_tests:
          - not_null
      - name: activity_type_code
        description: "Type code (VARCHAR reference)"
      - name: activity_type_name
        description: "Display name"
      - name: is_completed
        description: "Completion status"
        data_tests:
          - not_null
      - name: activity_timestamp
        data_tests:
          - not_null
      - name: activity_date
        data_tests:
          - not_null
      - name: activity_month
        data_tests:
          - not_null
      - name: activity_week
        data_tests:
          - not_null
      - name: activity_quarter
        data_tests:
          - not_null
      - name: activity_year
        data_tests:
          - not_null

  - name: stg_pipedrive__activity_types
    description: |
      Staging model for activity type definitions.
      Simple lookup table mapping codes to display names.
      Grain: One row per activity type
      Rows: 4
    config:
      tags: ['staging', 'dimension', 'static']
    columns:
      - name: activity_type_id
        description: "Unique activity type identifier"
        data_tests:
          - unique
          - not_null
      - name: activity_type_code
        description: "Activity type code (meeting, sc_2, follow_up, after_close_call)"
        data_tests:
          - unique
          - not_null
      - name: activity_type_name
        description: "Display name"
        data_tests:
          - not_null
      - name: is_active
        description: "Whether type is currently active"

  - name: stg_pipedrive__users
    description: |
      Staging model for sales team users.
      Type 1 SCD with test user flagging.
      Grain: One row per user
      Rows: 1,787
    config:
      tags: ['staging', 'dimension', 'daily']
    columns:
      - name: user_id
        description: "Unique user identifier"
        data_tests:
          - unique
          - not_null
      - name: user_name
        description: "User full name"
        data_tests:
          - not_null
      - name: user_email
        description: "User email (NOT unique - some shared emails)"
        data_tests:
          - not_null
      - name: last_modified_at
        description: "Last modification timestamp"
      - name: is_test_user
        description: "Flag for test users (exclude with WHERE NOT is_test_user)"
        data_tests:
          - not_null
          - accepted_values:
              values: [true, false]