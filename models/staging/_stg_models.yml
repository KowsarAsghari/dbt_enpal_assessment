version: 2

models:
  - name: stg_pipedrive__deal_changes
    description: |
      Staging model for deal stage change events.
      Filters for stage transitions and adds date fields.
      Grain: One row per stage change per deal
      Rows: 8,906
    config:
      tags: ['staging', 'daily']
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - deal_id
            - stage_change_timestamp
            - stage_id
    columns:
      - name: change_id
        description: "Surrogate key"
        data_tests:
          - unique
          - not_null
      - name: deal_id
        description: "Deal identifier"
        data_tests:
          - not_null
      - name: stage_id
        description: "Pipeline stage (1-9, expandable)"
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_pipedrive__stages')
              field: stage_id
      - name: stage_change_timestamp
        data_tests:
          - not_null
      - name: stage_change_date
        data_tests:
          - not_null
      - name: stage_change_month
        data_tests:
          - not_null
      - name: stage_change_week
        data_tests:
          - not_null
      - name: stage_change_quarter
        data_tests:
          - not_null
      - name: stage_change_year
        data_tests:
          - not_null

  - name: stg_pipedrive__stages
    description: |
      Staging model for pipeline stage definitions.
      Adds stage_category and stage_order.
      Grain: One row per stage
      Rows: 9
    config:
      tags: ['staging', 'dimension', 'static']
    columns:
      - name: stage_id
        description: "Unique stage identifier"
        data_tests:
          - unique
          - not_null
      - name: stage_name
        data_tests:
          - not_null
          - unique
      - name: stage_order
        data_tests:
          - not_null
      - name: stage_category
        data_tests:
          - not_null
          - accepted_values:
              values: ['Early Stage', 'Mid Stage', 'Late Stage']

  - name: stg_pipedrive__activity
    description: |
      ...
    config:
      tags: ['staging', 'daily']
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - activity_id
            - deal_id
    columns:
      - name: activity_id
        description: "Activity identifier (NOT unique - same ID can link to multiple deals)"
        data_tests:
          - not_null
      - name: deal_id
        description: "Related deal"
      - name: user_id
        description: "Assigned user"
        data_tests:
          - not_null
      - name: activity_type_id
        description: "Activity type (INTEGER FK)"
        data_tests:
          - not_null
      - name: activity_type_code
        description: "Type code (VARCHAR reference)"
      - name: activity_type_name
        description: "Display name"
      - name: is_completed
        description: "Completion status"
        data_tests:
          - not_null
      - name: activity_timestamp
        data_tests:
          - not_null
      - name: activity_date
        data_tests:
          - not_null
      - name: activity_month
        data_tests:
          - not_null
      - name: activity_week
        data_tests:
          - not_null
      - name: activity_quarter
        data_tests:
          - not_null
      - name: activity_year
        data_tests:
          - not_null